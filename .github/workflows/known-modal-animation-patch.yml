name: Patch Known modal animation
on:
  push:
    branches:
      - experiment/known-modal-animation
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path('artifacts/breeze-portfolio/src/App.tsx')
          text = app.read_text()
          imp = "import { KnownAnimationPreview } from '@/components/known-animation-preview';\n"
          if imp not in text:
              anchor = "import { portfolio, audioAssetPath, discordDestination, type Project, type ProjectCategory } from '@/data/portfolio';\n"
              text = text.replace(anchor, anchor + imp, 1)
          if '<KnownAnimationPreview />' not in text:
              pattern = r'(<h[1-6][^>]*>\\{selected\\.title\\}</h[1-6]>)'
              text, n = re.subn(pattern, r'<KnownAnimationPreview />\n\\1', text, count=1)
              if n != 1:
                  raise SystemExit('selected.title heading not found')
          app.write_text(text)
          component = Path('artifacts/breeze-portfolio/src/components/known-animation-preview.tsx')
          component.parent.mkdir(parents=True, exist_ok=True)
          component.write_text('''import { useEffect, useState } from "react";\n\nconst frames = [\n  ["inbox", "Maya Rivera", "Question about my order", "Customer found"],\n  ["conversation", "Maya Rivera", "Order #1048 arrived with the wrong size.", "2 memories surfaced"],\n  ["customer context", "Maya Rivera", "Returning customer · 4 orders", "Preference: medium"],\n  ["AI response", "Draft ready", "I found Maya’s previous order and size preference.", "Memory used"],\n] as const;\n\nexport function KnownAnimationPreview() {\n  const [frame, setFrame] = useState(0);\n  useEffect(() => { const id = window.setInterval(() => setFrame((v) => (v + 1) % frames.length), 1750); return () => window.clearInterval(id); }, []);\n  const [label, title, body, context] = frames[frame];\n  return <div className="mb-7 w-full max-w-[330px] overflow-hidden border border-white/15 bg-[#101116]" aria-label="Known product animation preview">\n    <div className="flex items-center justify-between border-b border-white/10 px-3 py-2"><span className="mono text-[8px] uppercase tracking-[.16em] text-[#8f918c]">known / product preview</span><span className="flex items-center gap-1.5 mono text-[8px] text-[#d5ff65]"><span className="h-1.5 w-1.5 rounded-full bg-[#d5ff65]" /> live</span></div>\n    <div className="grid h-[155px] grid-cols-[68px_1fr] gap-2 p-3">\n      <div className="border border-white/10 bg-[#15171d] p-2"><div className="mb-3 h-1 w-7 bg-white/20" />{frames.map((_, i) => <div key={i} className={`mb-2 h-5 border px-1.5 transition-all duration-500 ${frame === i ? "border-[#d5ff65]/40 bg-[#d5ff65]/10" : "border-white/5 bg-white/[.02]"}`}><span className="mt-1.5 block h-1 w-8 bg-white/10" /></div>)}</div>\n      <div className="border border-white/10 bg-[#14161c] p-3"><div className="flex items-center justify-between"><span className="mono text-[7px] uppercase tracking-[.14em] text-[#d5ff65]">{label}</span><span className="mono text-[7px] text-white/25">0{frame + 1} / 04</span></div><div className="mt-3 flex gap-2"><div className="h-6 w-6 rounded-full border border-white/15 bg-white/5" /><div className="min-w-0 flex-1"><div className="text-[10px] font-medium text-[#e8e7dc]">{title}</div><div className="mt-1 text-[8px] leading-relaxed text-[#8f918c]">{body}</div></div></div><div className="mt-3 border-t border-white/10 pt-2"><div className="flex items-center justify-between"><span className="mono text-[7px] uppercase tracking-[.12em] text-white/30">memory</span><span className="mono text-[7px] text-[#d5ff65]">{context}</span></div><div className="mt-2 h-1.5 overflow-hidden bg-white/5"><div className="h-full bg-[#d5ff65]/50 transition-all duration-700" style={{ width: `${35 + frame * 20}%` }} /></div></div></div>\n    </div>\n    <div className="flex gap-1 border-t border-white/10 px-3 py-2">{frames.map((_, i) => <span key={i} className={`h-px flex-1 ${i === frame ? "bg-[#d5ff65]" : "bg-white/10"}`} />)}</div>\n  </div>;\n}\n''')
          PY
      - name: Commit patch
        run: |
          rm .github/workflows/known-modal-animation-experiment.yml .github/workflows/known-modal-animation-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: preview Known animation in project modal'
          git push
